<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e8aa5c" />
    <title>Private Presentation | Morph Mug</title>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}" />
    <link rel="icon" href="{{ url_for('static', filename='icons/morph-mug-icon.svg') }}" type="image/svg+xml" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="download-page">
      <section class="download-hero login-card">
        <img class="download-logo" src="{{ url_for('static', filename='icons/morph-mug-icon.svg') }}" alt="Morph Mug" />
        <p class="eyebrow">PRIVATE PRESENTATION</p>
        <h1>Morph Mug access</h1>
        <p class="download-lead">Enter the presentation password to open the Morph Mug system.</p>
        {% if error %}<p class="login-error">{{ error }}</p>{% endif %}
        <form method="post" class="login-form">
          <label for="password">Presentation password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
          <button class="primary-button" type="submit">Enter Morph Mug</button>
        </form>
      </section>
    </main>
  </body>
</html>
